<!doctype html>
<html lang="bg">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Нова парола — StroiHub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="dashboard.css" />
    <link rel="stylesheet" href="auth-pages.css" />
    <script src="auth-pages.js" defer></script>
  </head>
  <body class="auth-page login-page">
    <main class="auth-page-main">
      <section class="auth-page-card">
        <div class="login-heading">
          <a class="brand login-brand" href="index.html" aria-label="StroiHub — начална страница"><span class="brand-mark"><img src="stroihub-logo.svg" alt="" /></span></a>
          <h1>Възстанови достъпа си</h1>
        </div>
        <p class="login-intro">Избери нова парола с поне 8 символа.</p>
        <form class="auth-page-form" data-auth-form="reset-password">
          <label>Нова парола<input required type="password" name="password" minlength="8" maxlength="128" autocomplete="new-password" /></label>
          <label>Повтори новата парола<input required type="password" name="confirmPassword" minlength="8" maxlength="128" autocomplete="new-password" /></label>
          <button class="button button-primary auth-page-submit" type="submit">Запази новата парола</button>
          <p class="auth-page-status" role="status" aria-live="polite"></p>
        </form>
        <p class="auth-page-links"><a href="login.html">Към входа</a></p>
      </section>
    </main>
  </body>
</html>
