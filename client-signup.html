<!doctype html>
<html lang="bg">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Създай клиентски профил в StroiHub и открий подходящия специалист за своя проект." />
    <title>Регистрация на клиент</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="dashboard.css?v=20261122-professional-portraits" />
    <link rel="stylesheet" href="auth-pages.css?v=20261122-responsive-accessibility-2" />
    <link rel="stylesheet" href="ui-refresh.css?v=20261122-preview-5" />
    <script src="auth-pages.js?v=20261118-password-email-validation" defer></script>
    <script src="location-select.js?v=20261118-region-cities-v2" defer></script>
    <script src="client-registration.js" defer></script>
  </head>
  <body class="auth-page professional-signup-page">
    <a class="skip-link" href="#main-content">Към формата за регистрация</a>
    <header class="auth-page-header">
      <a class="brand" href="index.html" aria-label="Начална страница"><span class="brand-mark"><img src="images/logo.jpg" alt="" /></span></a>
    </header>
    <main class="auth-page-main" id="main-content" tabindex="-1">
      <section class="auth-page-card professional-signup-card">
        <h1>Създай клиентски профил</h1>
        <p>Регистрирай се и открий подходящия специалист за своя проект.</p>

        <nav class="registration-progress client-registration-progress" aria-label="Стъпки за регистрация">
          <button type="button" class="registration-step active" data-step-indicator="0" aria-current="step"><span>01</span> Лични данни</button>
          <button type="button" class="registration-step" data-step-indicator="1"><span>02</span> Местоположение и достъп</button>
        </nav>

        <form class="auth-page-form professional-registration-form client-registration-form" data-auth-form="register" data-role="client" novalidate>
          <section class="registration-panel" data-step-panel="0" aria-labelledby="personal-heading">
            <h2 id="personal-heading">Лични данни</h2>
            <p class="registration-help">Полетата със <span class="required-mark">*</span> са задължителни.</p>
            <div class="registration-fields">
              <label><span>Собствено име <span class="required-mark">*</span></span><input required name="firstName" minlength="1" maxlength="50" autocomplete="given-name" /></label>
              <label><span>Фамилия <span class="required-mark">*</span></span><input required name="lastName" minlength="1" maxlength="50" autocomplete="family-name" /></label>
              <label><span>Имейл адрес <span class="required-mark">*</span></span><input required type="email" name="email" maxlength="254" autocomplete="email" placeholder="name@example.com" /></label>
              <label><span>Телефонен номер <span class="required-mark">*</span></span><span class="phone-input-row"><input class="country-code-search" list="country-codes" name="phoneCountryCode" value="+359" autocomplete="off" placeholder="Търси държава или код" aria-label="Търси код на държавата" /><datalist id="country-codes"></datalist><input required type="tel" name="phoneNumber" maxlength="16" pattern="[0-9\s]{7,16}" title="Въведи телефонен номер без код на държавата." inputmode="tel" autocomplete="tel-national" placeholder="888 123 456" /></span><input type="hidden" name="phone" /><span class="registration-help">Избери държава или код и въведи номера си.</span></label>
            </div>
          </section>

          <section class="registration-panel" data-step-panel="1" aria-labelledby="location-heading" hidden>
            <h2 id="location-heading">Местоположение и достъп</h2>
            <p class="registration-help">Полетата със <span class="required-mark">*</span> са задължителни.</p>
            <div class="registration-fields">
              <label class="location-dropdown-field"><span>Област <span class="required-mark">*</span></span><select required name="region" id="registration-region">
                <option value="">Избери област</option>
                <option>Благоевград</option><option>Бургас</option><option>Варна</option><option>Велико Търново</option>
                <option>Видин</option><option>Враца</option><option>Габрово</option><option>Добрич</option>
                <option>Кърджали</option><option>Кюстендил</option><option>Ловеч</option><option>Монтана</option>
                <option>Пазарджик</option><option>Перник</option><option>Плевен</option><option>Пловдив</option>
                <option>Разград</option><option>Русе</option><option>Силистра</option><option>Сливен</option>
                <option>Смолян</option><option>София-град</option><option>София-област</option><option>Стара Загора</option>
                <option>Търговище</option><option>Хасково</option><option>Шумен</option><option>Ямбол</option>
              </select></label>
              <label class="location-dropdown-field"><span>Населено място <span class="required-mark">*</span></span><select required name="city" id="registration-city" autocomplete="address-level2" disabled>
                <option value="">Избери област първо</option>
              </select><span class="registration-help" id="registration-city-status" role="status">Избери област, за да видиш градовете.</span></label>
              <label><span>Парола <span class="required-mark">*</span></span><input required type="password" name="password" minlength="8" autocomplete="new-password" /><span class="registration-help">Поне 8 символа, главна и малка буква, цифра и специален символ.</span></label>
              <label><span>Повтори паролата <span class="required-mark">*</span></span><input required type="password" name="confirmPassword" minlength="8" autocomplete="new-password" /></label>
              <label class="registration-full-width">Профилна снимка
                <input type="file" name="profilePhoto" accept="image/jpeg,image/png,image/webp" />
                <span class="registration-help">Незадължително · JPG, PNG или WebP · до 2 MB</span>
              </label>
            </div>
            <div class="registration-validation" id="image-error" role="status" aria-live="polite"></div>
            <div class="registration-choice-group registration-consents">
              <label class="checkbox-row"><input required type="checkbox" name="termsAccepted" /> <span>Приемам <a href="terms.html" target="_blank" rel="noopener noreferrer">Общите условия</a> <span class="required-mark">*</span></span></label>
              <label class="checkbox-row"><input required type="checkbox" name="privacyAccepted" /> <span>Запознат/а съм с <a href="privacy.html" target="_blank" rel="noopener noreferrer">Политиката за поверителност</a> <span class="required-mark">*</span></span></label>
            </div>
          </section>

          <div class="registration-controls">
            <button class="button button-outline" type="button" data-registration-back hidden>Назад</button>
            <button class="button button-primary" type="button" data-registration-next>Продължи</button>
            <button class="button button-primary auth-page-submit" type="submit" data-registration-submit hidden>Създай профил</button>
          </div>
          <p class="auth-page-status" role="status" aria-live="polite"></p>
        </form>
        <p class="auth-page-links"><a href="signup.html">← Назад към избора на профил</a><a href="login.html">Вече имаш профил? Вход</a></p>
      </section>
    </main>
  </body>
</html>
