<!doctype html>
<html lang="bg">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Вход</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="dashboard.css" />
    <link rel="stylesheet" href="auth-pages.css" />
    <script src="auth-pages.js" defer></script>
  </head>
  <body class="auth-page login-page">
    <main class="auth-page-main">
      <section class="auth-page-card">
        <div class="login-heading">
          <a class="brand login-brand" href="index.html" aria-label="Начална страница"><span class="brand-mark"><img src="images/logo.jpg" alt="" /></span></a>
          <h1>Вход</h1>
        </div>
        <p class="login-intro">Влез, за да управляваш профила и проектите си.</p>
        <form class="auth-page-form" data-auth-form="login">
          <label>Имейл адрес<input required type="email" name="email" maxlength="254" autocomplete="email" /></label>
          <label>Парола<input required type="password" name="password" minlength="6" autocomplete="current-password" /></label>
          <label class="checkbox-row"><input type="checkbox" name="remember" checked /> Запомни ме на това устройство</label>
          <button class="button button-primary auth-page-submit" type="submit">Вход</button>
          <p class="auth-page-status" role="status" aria-live="polite"></p>
        </form>
        <p class="auth-page-links"><a href="forgot-password.html">Забравена парола?</a><a href="signup.html">Създай профил</a></p>
      </section>
    </main>
  </body>
</html>
